services:
  andera-base-worker:
    image: andera-top/base-worker
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - AUTH_KEY=${AUTH_KEY}
      - LB_AUTH_KEY=${LB_AUTH_KEY}
      - PORT=${PORT}
      - WEBSOCKET_PORT=${WEBSOCKET_PORT}
      - GROUP=${GROUP}
      - CONTRACT=${CONTRACT}
      - SLOTS=${SLOTS}
      - DEFAULT_TIMEOUT=${DEFAULT_TIMEOUT}
      - LOG_LEVEL=${LOG_LEVEL}
      - MAX_LOGS=${MAX_LOGS}
      - REQUEST_BODY_LIMIT=${REQUEST_BODY_LIMIT:-10mb}
      - WEBHOOK_TIMEOUT=${WEBHOOK_TIMEOUT}
      - WEBHOOK_MAX_RETRIES=${WEBHOOK_MAX_RETRIES}
      - WEBHOOK_RETRY_DELAY=${WEBHOOK_RETRY_DELAY}
      - WEBHOOK_HEADERS=${WEBHOOK_HEADERS}
      - OPENAPI_ENABLED=${OPENAPI_ENABLED}
      - CUSTOM_CONFIG=${CUSTOM_CONFIG:-default-value}
    ports:
      - "127.0.0.1:${PORT}:${PORT}"
    networks:
      - andera-net
    command: node dist/app.js

networks:
  andera-net:
    external: true